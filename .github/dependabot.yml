version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ['@nestjs/*']
      typescript-tooling:
        patterns:
          [
            'typescript',
            '@typescript-eslint/*',
            'ts-jest',
            'jest',
            '@types/jest',
          ]
      compatible-updates:
        update-types: [minor, patch]
        exclude-patterns:
          [
            '@nestjs/*',
            'typescript',
            '@typescript-eslint/*',
            'ts-jest',
            'jest',
            '@types/jest',
          ]
    ignore:
      # Follow the supported runtime, not types for the newest Node major.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Upgrade only once Nest schematics + eslint/ts-jest peers support TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
