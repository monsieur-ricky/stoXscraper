name: CI

on:
  push:
    branches: [main, 'improvements/update-project*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Validate dependency tree
        run: npm ls --depth=0
      - name: Static checks, build and offline testing trophy
        run: npm run check
      - name: Reject all production vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: Reject high or critical development vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify production-only installation and compiled imports
        run: |
          npm ci --omit=dev
          NODE_ENV=production node -e "require('./dist/app.module.js'); require('./dist/utilities/playwright.service.js')"
